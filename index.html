function getSlugFromUrl(){
  const path = window.location.pathname.replace(/^\/|\/$/g,'');
  const search = new URLSearchParams(window.location.search);
  if(search.get('school')) return search.get('school');
  if(window.location.hash) return window.location.hash.replace('#','').replace('/','');
  if(path && path !== 'index.html' && path !== '') return path.split('/')[0];
  return null;
}

async function init(){
  const slug = getSlugFromUrl();
  if(slug && slug !== 'admin'){
    // Try student portal
    await renderStudentPortal(slug);
  } else {
    await renderAdmin();
  }
}

async function fetchSchools(){
  if(!sb) return [];
  const { data, error } = await sb.from('schools').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); return []; }
  return data || [];
}

function autoSlug(){
  const name = document.getElementById('f_name').value;
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  document.getElementById('f_slug').value = slug;
  document.getElementById('slugPreview').innerText = slug || 'slug';
}

function openAdd(){
  editingSchool = null;
  document.getElementById('modalTitle').innerText = 'Add New School';
  document.getElementById('submitText').innerText = 'Create School + Portal →';
  document.getElementById('f_name').value=''; document.getElementById('f_slug').value=''; document.getElementById('f_email').value=''; document.getElementById('f_owner').value=''; document.getElementById('f_state').value='CA'; document.getElementById('f_color').value='#00E5FF'; document.getElementById('f_plan').value='growth';
  document.getElementById('slugPreview').innerText='slug';
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
async function editSchool(id){
  const s = schools.find(x=>x.id===id);
  if(!s) return;
  editingSchool = s;
  document.getElementById('modalTitle').innerText = 'Manage School - ' + s.name;
  document.getElementById('submitText').innerText = 'Save Changes →';
  document.getElementById('f_name').value=s.name; document.getElementById('f_slug').value=s.subdomain; document.getElementById('f_email').value=s.owner_email; document.getElementById('f_owner').value=''; document.getElementById('f_state').value=s.state; document.getElementById('f_color').value=s.primary_color||'#00E5FF'; document.getElementById('f_plan').value=s.plan;
  document.getElementById('slugPreview').innerText=s.subdomain;
  document.getElementById('modal').classList.remove('hidden');
}
async function deleteSchool(id){
  if(!confirm('Delete this school?')) return;
  const { error } = await sb.from('schools').delete().eq('id', id);
  if(error) alert(error.message);
  else renderAdmin();
}
async function handleForm(e){
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled=true; btn.innerText='Saving...';
  const payload = {
    name: document.getElementById('f_name').value.trim(),
    subdomain: document.getElementById('f_slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-'),
    state: document.getElementById('f_state').value.trim() || 'CA',
    owner_email: document.getElementById('f_email').value.trim(),
    primary_color: document.getElementById('f_color').value,
    custom_aqua_color: document.getElementById('f_color').value,
    plan: document.getElementById('f_plan').value,
    status: 'active'
  };
  payload.subdomain_slug = payload.subdomain;
  let error;
  if(editingSchool){
    const res = await sb.from('schools').update(payload).eq('id', editingSchool.id);
    error = res.error;
  } else {
    const res = await sb.from('schools').insert(payload).select().single();
    error = res.error;
    if(!error && res.data){
      await sb.from('users').insert({ email: payload.owner_email, role: 'school_owner', school_id: res.data.id, full_name: document.getElementById('f_owner').value || payload.name + ' Admin' });
      await sb.from('cohorts').insert({ school_id: res.data.id, name: 'Cohort 1 - ' + new Date().getFullYear(), start_date: new Date().toISOString().split('T')[0] });
    }
  }
  btn.disabled=false;
  if(error) alert('Error: '+error.message);
  else { closeModal(); renderAdmin(); }
}

function setTab(t){
  activeTab = t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('tab-'+t);
  if(el) el.classList.add('active');
  renderTab();
}

function renderTab(){
  const container = document.getElementById('tabContent');
  if(!container) return;
  const aqua = currentSchool.primary_color || '#00E5FF';
  if(activeTab==='curriculum'){
    if(weeks.length===0){
      container.innerHTML = `<div class="card" style="padding:32px;text-align:center;color:rgba(255,255,255,0.5)">No curriculum yet. Run SQL: <code>seed_curriculum.sql</code> in Supabase. Then refresh.<br><br>Weeks table empty. Add weeks in Supabase → curriculum_weeks.</div>`;
      return;
    }
    container.innerHTML = `<div class="card" style="overflow:hidden">` + weeks.map(w=>{
      const wl = lessons.filter(l=>l.week_id===w.id);
      const open = activeWeek===w.week_number;
      return `<div class="week" style="background:#111"><button onclick="toggleWeek(${w.week_number})" style="width:100%;text-align:left;background:transparent;border:none;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer"><div style="display:flex;gap:12px;align-items:center"><div style="width:28px;height:28px;border-radius:8px;background:${open?aqua:'rgba(255,255,255,0.08)'};color:${open?'#000':'#fff'};display:grid;place-items:center;font-size:12px;font-weight:700">${w.week_number}</div><div><div style="font-weight:600;font-size:14px">${w.title}</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">${w.description||''} • ${wl.length} lessons</div></div></div><div style="color:rgba(255,255,255,0.4)">${open?'−':'+'}</div></button>${open?`<div style="padding:0 18px 14px 58px;display:grid;gap:8px">${wl.map(l=>`<div class="lesson"><div style="display:flex;gap:10px;align-items:center"><div style="width:6px;height:6px;border-radius:50%;background:${aqua}"></div><span style="font-size:13px">${l.title}</span><span style="font-size:11px;color:rgba(255,255,255,0.4)">${l.duration_minutes||30}m</span></div><button style="background:${aqua};color:#000;border:none;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700">Start →</button></div>`).join('')}<div style="display:flex;gap:8px;margin-top:8px"><div style="background:rgba(0,229,255,0.1);border:1px solid ${aqua}40;padding:6px 10px;border-radius:8px;font-size:11px;color:${aqua}">Quiz: 70% to pass</div><div style="background:rgba(255,255,255,0.06);padding:6px 10px;border-radius:8px;font-size:11px;color:rgba(255,255,255,0.6)">+4.5 clock hours</div></div></div>`:''}</div>`;
    }).join('') + `</div>`;
  } else if(activeTab==='attendance'){
    container.innerHTML = `<div class="card" style="padding:20px"><h3 style="margin-bottom:14px">Attendance Records</h3>${[1,2,3,4,5].map(d=>`<div style="display:flex;justify-content:space-between;padding:10px;background:#000;border-radius:10px;margin-bottom:8px;font-size:13px"><span>2026-01-0${d} • Week ${d}</span><span style="color:#00ff88">Present • 8 hrs</span></div>`).join('')}</div>`;
  } else if(activeTab==='externship'){
    container.innerHTML = `<div class="card" style="padding:20px"><h3 style="margin-bottom:14px">Externship Timesheet</h3><div style="background:#000;border-radius:12px;padding:14px;margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span style="font-size:13px">Site: ${currentSchool.name} Clinic</span><span style="font-size:11px;color:${aqua}">160 hrs required</span></div><div style="height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:10px"><div style="width:42%;height:100%;background:${aqua};border-radius:3px"></div></div><div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:6px">67.5 / 160 hrs completed</div></div><button style="width:100%;background:${aqua};color:#000;border:none;padding:14px;border-radius:12px;font-weight:700;cursor:pointer">Clock In • GPS Verification →</button><div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:8px;text-align:center">Requires GPS at externship site • Preceptor signature</div></div>`;
  } else {
    container.innerHTML = `<div class="card" style="padding:20px"><h3 style="margin-bottom:14px">Billing & Plan</h3><div style="background:#000;padding:14px;border-radius:12px;display:flex;justify-content:space-between"><span>Plan: ${currentSchool.plan}</span><span style="color:${aqua}">$497/mo</span></div><div style="margin-top:12px;font-size:12px;color:rgba(255,255,255,0.5)">Owner: ${currentSchool.owner_email}<br>Subdomain: ${currentSchool.subdomain}</div></div>`;
  }
}

function toggleWeek(n){
  activeWeek = activeWeek===n ? null : n;
  renderTab();
}

// Init
document.addEventListener('DOMContentLoaded', ()=>{
  // Try to get Supabase keys from localStorage or use prompt
  const url = prompt('Enter Supabase URL (or leave blank if already set):', localStorage.getItem('SCPA_SB_URL')||'') || localStorage.getItem('SCPA_SB_URL');
  const key = prompt('Enter Supabase Anon Key:', localStorage.getItem('SCPA_SB_KEY')||'') || localStorage.getItem('SCPA_SB_KEY');
  if(url && key){
    localStorage.setItem('SCPA_SB_URL', url);
    localStorage.setItem('SCPA_SB_KEY', key);
    sb = supabase.createClient(url, key);
  } else {
    // Use hardcoded from previous project if available
    try{
      const savedUrl = localStorage.getItem('SCPA_SB_URL');
      const savedKey = localStorage.getItem('SCPA_SB_KEY');
      if(savedUrl && savedKey) sb = supabase.createClient(savedUrl, savedKey);
    }catch(e){}
  }
  if(!sb){
    // Last resort: try to use keys embedded in page (you must edit)
    document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;padding:40px;text-align:center"><div><h2>Setup Required</h2><p style="color:rgba(255,255,255,0.6);margin-top:12px">Edit index.html line 25-26 with your Supabase URL and Anon Key,<br>then re-upload to GitHub.</p><p style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:16px">Find keys: Supabase Dashboard → Settings → API</p></div></div>`;
    return;
  }
  init();
});

window.addEventListener('hashchange', init);
</script>
