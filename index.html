<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCPA Platform - Multi-Tenant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:28px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{font-size:22px;margin-bottom:6px}
.sub{color:#888;font-size:13px;margin-bottom:20px}
input{width:100%;background:#000;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#fff;margin-bottom:12px;outline:none}
input:focus{border-color:#5e6ad2}
button{width:100%;background:#fff;color:#000;border:0;border-radius:10px;padding:12px;font-weight:600;cursor:pointer;margin-top:8px}
button:disabled{opacity:0.5}
.msg{margin-top:14px;font-size:13px;padding:10px;border-radius:8px;display:none}
.msg.err{display:block;background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.2);color:#ff9a9a}
.msg.ok{display:block;background:rgba(80,255,120,0.08);border:1px solid rgba(80,255,120,0.15);color:#aaffbb}
.dashboard{width:100%;max-width:1000px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:18px;background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:12px}
.badge{font-size:11px;background:#222;padding:4px 8px;border-radius:99px;color:#aaa}
.lesson{background:#000;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>

<script>
// === HARDCODED - NO MORE POPUP ===
const SUPABASE_URL = 'https://xpqwstufuiucsmtuffvc.supabase.co';
const SUPABASE_ANON = 'sb_publishable_9csDO6QGhhYsOmiFIg5CIw_uxu-Uq_5';

let supabaseClient = null;
function getSupabase(){
  if(supabaseClient) return supabaseClient;
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  // clear any old bad values
  localStorage.removeItem('sb_url');
  localStorage.removeItem('sb_key');
  localStorage.removeItem('supabase_url');
  localStorage.removeItem('supabase_key');
  return supabaseClient;
}

const app = document.getElementById('app');

function renderLogin(msg='', isErr=false){
  app.innerHTML = `
  <div class="card">
    <h1>SCPA Platform</h1>
    <div class="sub">Multi-tenant login — hardcoded to your Supabase</div>
    <input id="email" type="email" placeholder="Email" value="">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Sign In</button>
    <div id="msg" class="msg ${msg ? (isErr?'err':'ok') : ''}" style="${msg?'display:block':''}">${msg||''}</div>
    <div class="sub" style="margin-top:16px;text-align:center">Connected to<br><span style="color:#888">${SUPABASE_URL}</span></div>
  </div>`;
  document.getElementById('loginBtn').onclick = doLogin;
}

async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const msgEl = document.getElementById('msg');
  if(!email || !password){ msgEl.textContent='Enter email and password'; msgEl.className='msg err'; return; }
  btn.disabled=true; btn.textContent='Signing in...';
  try{
    const supabase = getSupabase();
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) throw error;
    msgEl.textContent='Success! Loading...'; msgEl.className='msg ok';
    renderDashboard(data.user);
  }catch(e){
    msgEl.textContent = e.message || 'Login failed';
    msgEl.className='msg err';
    btn.disabled=false; btn.textContent='Sign In';
  }
}

function renderDashboard(user){
  app.innerHTML = `
  <div class="dashboard">
    <div class="topbar">
      <div>
        <div style="font-weight:700">SCPA Platform v2</div>
        <div class="badge">${user.email}</div>
      </div>
      <button id="logout" style="width:auto;padding:8px 14px">Logout</button>
    </div>
    <div class="card" style="max-width:100%">
      <h1>Welcome ${user.email}</h1>
      <div class="sub">Supabase connected • No popup • Fixed build</div>
      <div id="lessons" style="margin-top:20px">Loading data...</div>
    </div>
  </div>`;
  document.getElementById('logout').onclick = async ()=>{
    await getSupabase().auth.signOut();
    renderLogin('Logged out');
  };
  loadData();
}

async function loadData(){
  try{
    const supabase = getSupabase();
    // Try to load something - adapt to your tables
    const { data, error } = await supabase.from('lessons').select('*').limit(20);
    const el = document.getElementById('lessons');
    if(error){
      el.innerHTML = `<div class="sub">Connected successfully! Table 'lessons' not found yet — but auth works. Error: ${error.message}</div>`;
      return;
    }
    if(!data || data.length===0){
      el.innerHTML = `<div class="sub">Connected! No lessons yet. Add data in Supabase Table Editor.</div>`;
      return;
    }
    el.innerHTML = data.map(l=>`<div class="lesson"><span>${l.title||l.name||'Lesson'}</span><span class="badge">${l.id}</span></div>`).join('');
  }catch(e){
    document.getElementById('lessons').innerHTML = `<div class="sub">Connected! (Load error: ${e.message})</div>`;
  }
}

// Init
(async()=>{
  try{
    const supabase = getSupabase();
    const { data } = await supabase.auth.getSession();
    if(data.session && data.session.user){
      renderDashboard(data.session.user);
    }else{
      renderLogin();
    }
  }catch(e){
    renderLogin('Init error: '+e.message, true);
  }
})();
</script>
</body>
</html>
